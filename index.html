<style>
  :root {
    --ink: #3a2123;
    --muted: #8a7376;
    --brand: #9a2130;
    --card: #ffffff;
    --bg: #f6efec;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, #ffe9e2 0%, rgba(255,233,226,0) 60%),
      linear-gradient(180deg, #fdf7f4 0%, var(--bg) 100%);
    min-height: 100vh;
    padding: 34px 18px 60px;
  }
  .wrap { max-width: 940px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 26px; }
  h1 {
    margin: 0 0 8px;
    font-size: clamp(24px, 6vw, 34px);
    letter-spacing: .06em;
    color: var(--brand);
    text-shadow: 0 2px 0 #fff, 0 10px 24px rgba(154, 33, 48, .12);
  }
  .sub { color: var(--muted); font-size: 14px; letter-spacing: .04em; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 18px;
    margin-top: 8px;
  }
  a.card {
    display: flex; flex-direction: column;
    background: var(--card);
    border-radius: 18px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    box-shadow: 0 2px 10px rgba(58, 33, 35, .07), 0 12px 28px rgba(58, 33, 35, .06);
    transition: transform .16s ease, box-shadow .16s ease;
  }
  a.card:hover, a.card:focus-visible { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(58,33,35,.12), 0 18px 36px rgba(58,33,35,.10); }
  a.card:active { transform: translateY(-1px) scale(.995); }
  .cover {
    aspect-ratio: 16 / 10;
    background: linear-gradient(135deg, #f0d9d4 0%, #e6c8c2 100%);
    background-size: cover; background-position: center;
    position: relative;
  }
  .cover .badge {
    position: absolute; left: 10px; bottom: 10px;
    background: rgba(58, 33, 35, .72); color: #fff;
    font-size: 11px; letter-spacing: .08em;
    padding: 3px 9px; border-radius: 999px;
    backdrop-filter: blur(4px);
  }
  .body { padding: 14px 16px 16px; }
  .name { font-size: 17px; font-weight: 800; letter-spacing: .02em; }
  .desc { margin-top: 6px; font-size: 13px; line-height: 1.6; color: var(--muted); }
  .play { margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--brand); }
  .play::after { content: " →"; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  footer { margin-top: 34px; text-align: center; color: #a99a9c; font-size: 12px; line-height: 1.8; }
  footer.dedication {
    max-width: 660px; margin: 44px auto 0; padding-top: 20px;
    border-top: 1px solid #ecdedb; color: #9b8486;
    font-size: 12.5px; line-height: 2.1; letter-spacing: .02em;
    white-space: pre-line; /* 纪念文字由 JS 注入：保留换行，等价于原来的 <br> */
  }
  code { background: #f1e6e3; border-radius: 5px; padding: 1px 5px; font-size: 12px; }
</style>

    var n = src.indexOf("*/", i);
    return n < 0 ? src.length : n + 2;
  }
  function matchBracket(src, open) {
    var depth = 0;
    for (var i = open; i < src.length; i++) {
      var c = src.charAt(i);
      if (c === '"' || c === "'" || c === "`") { i = skipString(src, i) - 1; continue; }
      if (c === "/" && src.charAt(i + 1) === "/") { i = skipLineComment(src, i + 2) - 1; continue; }
      if (c === "/" && src.charAt(i + 1) === "*") { i = skipBlockComment(src, i + 2) - 1; continue; }
      if (c === "[") depth++;
      else if (c === "]") { depth--; if (depth === 0) return i; }
    }
    return -1;
  }
  /* 返回 var GAMES 这条声明的位置：
     start = "var GAMES" 起始处（替换从这里开始）
     open  = 数组 "[" 的下标；close = 配对 "]" 的下标（替换到 close 为止）
     注意：替换 [start, close] 而保留原来的分号，避免生成 "];" 与 ";" 打架。 */
  function findGamesRange(src) {
    var start = src.indexOf("var GAMES");
    if (start < 0) return null;
    var closeTag = "<" + "/script";
    var scriptEnd = src.indexOf(closeTag, start);
    if (scriptEnd < 0) scriptEnd = src.length;
    var open = src.indexOf("[", start);
    if (open < 0 || open > scriptEnd) return null;
    var close = matchBracket(src, open);
    if (close < 0 || close > scriptEnd) return null;
    return { start: start, open: open, close: close };
  }

  /* ---------- 把面板状态写回文件：只替换 GAMES 声明 + 配置变量赋值 ---------- */
  function buildModifiedHtml(src, games, title, sub, dedication, sec) {
    var range = findGamesRange(src);
    if (!range) return { ok: false, error: "没找到 GAMES 代码块，请确认当前文件是原始的 index.html" };
    var head = src.slice(0, range.start);        // 到 "var GAMES" 之前
    var tail = src.slice(range.close + 1);       // 从原数组 "]" 之后（通常是 ";"）开始
    var ca = head.split(MARK_A).length - 1;
    var cb = tail.split(MARK_B).length - 1;
    if (ca !== 1 || cb !== 1) {
      return { ok: false, error: "文件的写入标记异常（" + ca + "/" + cb + "），为避免写坏页面已中止" };
    }
    var decl = "var GAMES = " + gamesArrayCode(games);
    if (!/^\s*;/.test(tail)) decl += ";";        // 原文件没有分号时补一个
    var out = head + decl + tail;
    out = replaceVar(out, "HALL_TITLE", title);
    out = replaceVar(out, "HALL_SUB", sub);
    out = replaceVar(out, "HALL_DEDICATION", dedication);
    /* 密码常量：只有显式传了 sec 才写，避免日常改清单时误动密码 */
    if (sec) {
      if (sec.salt != null) out = replaceVar(out, "ADMIN_SALT", sec.salt);
      if (sec.hash != null) out = replaceVar(out, "ADMIN_PASS_HASH", sec.hash);
    }
    return { ok: true, html: out };
  }
  /* 读出源码里 var NAME = "字面量" 的那段字面量（含引号）；读不到返回 null。
     用途：产物自检时确认 ADMIN_SALT / ADMIN_PASS_HASH 真的按预期写进去了。 */
  function readVarLiteral(src, name) {
    var key = "var " + name;
    var at = src.indexOf(key);
    if (at < 0) return null;
    var eq = src.indexOf("=", at + key.length);
    if (eq < 0) return null;
    var v = eq + 1;
    while (v < src.length && /\s/.test(src.charAt(v))) v++;
    var c = src.charAt(v);
    if (c !== '"' && c !== "'" && c !== "`") return null;
    return src.slice(v, skipString(src, v));
  }
  function currentSec() { return { salt: ADMIN_SALT, hash: ADMIN_PASS_HASH }; }
  /* 替换形如 var NAME = <表达式>; 的赋值（只替换第一处）。
     用扫描器找字符串字面量的结尾，避免值里出现分号（如中文简介里的 ";"）时被截断。 */
  function replaceVar(src, name, value) {
    var key = "var " + name;
    var at = src.indexOf(key);
    if (at < 0) return src;
    var eq = src.indexOf("=", at + key.length);
    if (eq < 0) return src;
    var v = eq + 1;
    while (v < src.length && /\s/.test(src.charAt(v))) v++;
    var c = src.charAt(v);
    var end;
    if (c === '"' || c === "'" || c === "`") end = skipString(src, v);
    else {
      var semi = src.indexOf(";", v);
      end = semi < 0 ? src.length : semi;
    }
    return src.slice(0, eq + 1) + " " + jsStr(value) + src.slice(end);
  }

  /* ---------- 序列化 ---------- */
  function jsStr(s) {
    return '"' + String(s == null ? "" : s)
      .replace(/\\/g, "\\\\")
      .replace(/"/g, '\\"')
      .replace(/\r/g, "\\r")
      .replace(/\n/g, "\\n")
      .replace(/\u2028/g, "\\u2028")
      .replace(/\u2029/g, "\\u2029") + '"';
  }
  /* 只产出数组字面量 "[ … ]"；写回文件时沿用原文件里的那个分号。
     on 字段永远显式写出来：true = 在大厅显示，false = 大厅里隐藏。 */
  function gamesArrayCode(list) {
    var b = "[";
    for (var i = 0; i < list.length; i++) {
      var g = list[i];
      if (i) b += ",";
      b += "\n  {\n" +
        "    title: " + jsStr(g.title) + ",\n" +
        "    desc: " + jsStr(g.desc || "") + ",\n" +
        "    url: " + jsStr(g.url) + ",\n" +
        "    cover: " + jsStr(g.cover || "") + ",\n" +
        "    tag: " + jsStr(g.tag || "") + ",\n" +
        "    on: " + (g.on === false ? "false" : "true") + "\n" +
        "  }";
    }
    return b + "\n]";
  }
  /* 完整一条声明，供「复制 GAMES 代码」粘贴回文件 */
  function gamesCode(list) {
    return "var GAMES = " + gamesArrayCode(list) + ";";
  }

  /* ---------- 校验 ---------- */
  function validateGames(list) {
    var errs = [];
    if (!list.length) errs.push("至少要有一个游戏");
    list.forEach(function (g, i) {
      var no = "第 " + (i + 1) + " 条";
      if (!String(g.title || "").trim()) errs.push(no + "：标题不能为空");
      var u = String(g.url || "").trim();
      if (!u) errs.push(no + "：链接不能为空");
      else if (!/^(https?:|\/|\.{1,2}\/|[A-Za-z0-9_\-.]+\/)/.test(u)) {
        errs.push(no + "：链接需以 http / https / / 或相对路径开头");
      }
    });
    return errs;
  }

  function field(labelText, value, placeholder) {
    var w = el("div");
    w.appendChild(el("label", "ha-lab", labelText));
    var i = el("input", "ha-in", null);
    i.type = "text";
    i.value = value == null ? "" : value;
    if (placeholder) i.placeholder = placeholder;
    w.appendChild(i);
    w._input = i;
    return w;
  }

  function buildItem(g, i) {
    var box = el("div", "ha-item");
    box._index = i;
    var on = (g.on !== false);
    box.setAttribute("data-on", on ? "1" : "0");
    var head = el("div", "ha-itemhead");
    head.appendChild(el("span", "ha-no", "#" + (i + 1)));
    head.appendChild(el("span", "ha-lab", g.title || "(未命名)"));
    head.appendChild(el("span", "ha-spacer"));
    /* 【需求 2】每条一个「在大厅显示」勾选框，勾掉就不渲染这张卡片 */
    var onLab = el("label", "ha-on");
    var onBox = el("input");
    onBox.type = "checkbox";
    onBox.className = "ha-onbox";
    onBox.id = "haOn" + i;
    onBox.checked = on;
    onLab.appendChild(onBox);
    onLab.appendChild(document.createTextNode("在大厅显示"));
    head.appendChild(onLab);
    var up = el("button", null, "↑ 上移");
    var dn = el("button", null, "↓ 下移");
    var del = el("button", "ha-danger", "删除");
    up._act = "up"; dn._act = "down"; del._act = "del";
    head.appendChild(up); head.appendChild(dn); head.appendChild(del);
    box.appendChild(head);

    var g2 = el("div", "ha-grid2");
    g2.appendChild(field("标题", g.title, "游戏名"));
    g2.appendChild(field("链接", g.url, "https:// 或 相对路径"));
    box.appendChild(g2);

    var descW = field("简介", g.desc, "一句话简介");
    descW.style.marginTop = "8px";
    box.appendChild(descW);

    var g5 = el("div", "ha-grid5");
    g5.appendChild(field("封面图", g.cover, "可留空"));
    g5.appendChild(field("标签", g.tag, "可留空"));
    box.appendChild(g5);

    var inputs = box.querySelectorAll("input.ha-in");
    box._title = inputs[0];
    box._url = inputs[1];
    box._desc = inputs[2];
    box._cover = inputs[3];
    box._tag = inputs[4];
    box._on = onBox;
    onBox._box = box; /* 反向引用，供「全部显示/隐藏」批量改外观 */
    /* 输入即重渲染大厅卡片（所见即所得）；非法时红字提示、不回写 */
    function onInput() {
      var list = collectGames();
      var errs = validateGames(list);
      showErrors(errs);
      if (errs.length) return;
      GAMES = list;
      renderHall();
    }
    [box._title, box._desc, box._url, box._cover, box._tag].forEach(function (inp) {
      inp.addEventListener("input", onInput);
    });
    /* 勾选框走 change：实时联动卡片 + 顺手刷新「已隐藏」外观 */
    onBox.addEventListener("change", function () {
      box.setAttribute("data-on", onBox.checked ? "1" : "0");
      onInput();
      toast((onBox.checked ? "已在大厅显示：" : "已在大厅隐藏：") + (box._title.value.trim() || ("第 " + (i + 1) + " 条")));
    });
    return box;
  }

  function collectGames() {
    var out = [];
    if (!refs.list) return out;
    var items = refs.list.querySelectorAll(".ha-item");
    for (var i = 0; i < items.length; i++) {
      var b = items[i];
      out.push({
        title: b._title.value.trim(),
        desc: b._desc.value,
        url: b._url.value.trim(),
        cover: b._cover.value.trim(),
        tag: b._tag.value.trim(),
        on: !!(b._on && b._on.checked)
      });
    }
    return out;
  }

  function showErrors(errs) {
    if (!refs.err) return;
    if (!errs.length) {
      refs.err.className = "ha-err";
      refs.err.textContent = "";
      return;
    }
    refs.err.className = "ha-err show";
    refs.err.textContent = "⚠ 未写入：" + errs.join("；");
  }

  function fillList(selectIndex) {
    var games = snap.games.map(function (g) {
      return { title: g.title, desc: g.desc, url: g.url, cover: g.cover, tag: g.tag, on: g.on !== false };
    });
    refs.list.innerHTML = "";
    games.forEach(function (g, i) { refs.list.appendChild(buildItem(g, i)); });
    GAMES = collectGames();
    renderHall();
    if (typeof selectIndex === "number" && refs.list.children[selectIndex]) {
      refs.list.children[selectIndex].scrollIntoView({ block: "nearest" });
    }
  }

  function snapshotNow() {
    return {
      games: collectGames(),
      title: refs.t1.value,
      sub: refs.t2.value,
      dedication: refs.t3.value
    };
  }

  /* ---------- 保存 1：复制 GAMES 代码 ---------- */
  function doCopy() {
    var errs = validateGames(collectGames());
    showErrors(errs);
    if (errs.length) { toast("存在问题，未生成代码", "err"); return false; }
    var code = gamesCode(collectGames());
    showOut(code);
    copyText(code).then(function () {
      toast("已复制 GAMES 代码（" + collectGames().length + " 条），贴回文件即可");
    }).catch(function () {
      toast("复制失败，代码已显示在下方，请手动复制", "err");
    });
    return code;
  }
  function showOut(code) {
    refs.out.value = code;
    refs.out.className = "ha-out show";
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise(function (resolve, reject) {
      try {
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.top = "-1000px";
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand("copy");
        document.body.removeChild(ta);
        ok ? resolve() : reject(new Error("execCommand copy failed"));
      } catch (e) { reject(e); }
    });
  }

  /* ---------- 保存 2：下载整页 ---------- */
  /* 从当前 DOM 还原一份「干净」的整页源码：
     - 去掉面板注入的节点（#hallAdminRoot / #hallAdminStyle）与诊断属性
     - 清空运行时渲染出来的卡片，避免把渲染结果写死进文件
     - 补回 doctype（documentElement.outerHTML 不含 doctype，缺了会进怪异模式） */
  function cleanSource() {
    var root = document.documentElement.cloneNode(true);
    var doomed = root.querySelectorAll("#hallAdminRoot,#hallAdminStyle");
    for (var i = 0; i < doomed.length; i++) {
      if (doomed[i].parentNode) doomed[i].parentNode.removeChild(doomed[i]);
    }
    var b = root.querySelector("body");
    if (b) b.removeAttribute("data-ha-dump");
    var g = root.querySelector("#grid");
    if (g) g.innerHTML = "";
    return "<!DOCTYPE html>\n" + root.outerHTML;
  }
  /* 产物自检：宁可不让下载/发布，也不能把页面写坏 */
  function verifyOutput(html, games, sec) {
    if (html.slice(0, 20).indexOf("<!DOCTYPE") !== 0) return "产物缺少 <!DOCTYPE html>";
    var r = findGamesRange(html);
    if (!r) return "产物里找不到 GAMES 声明";
    if (html.slice(r.open, r.close + 1) !== gamesArrayCode(games)) return "产物里的 GAMES 数组和预期不一致";
    if (games.length && html.slice(r.open, r.close + 1).split("\n  {").length - 1 !== games.length) {
      return "产物条目数不对";
    }
    if (html.split(MARK_A).length - 1 !== 1 || html.split(MARK_B).length - 1 !== 1) return "产物写入标记数量不对";
    if (html.indexOf(NEEDLE_PANEL) >= 0 || html.indexOf(NEEDLE_STYLE) >= 0) {
      return "产物里混进了管理面板节点";
    }
    /* 密码常量：必须存在、格式合法、且与预期一致（改密码时这里是最后一道闸） */
    var want = sec || currentSec();
    var litSalt = readVarLiteral(html, "ADMIN_SALT");
    var litHash = readVarLiteral(html, "ADMIN_PASS_HASH");
    if (litSalt == null || litHash == null) return "产物里找不到 ADMIN_SALT / ADMIN_PASS_HASH 常量";
    if (!/^"[0-9a-f]{16}"$/.test(litHash)) return "产物的 ADMIN_PASS_HASH 不是 16 位十六进制";
    if (jsStr(want.salt) !== litSalt) return "产物里的 ADMIN_SALT 和预期不一致";
    if (jsStr(want.hash) !== litHash) return "产物里的 ADMIN_PASS_HASH 和预期不一致";
    return "";
  }
  function buildForSave() {
    buildForSaveError = "";
    var errs = validateGames(collectGames());
    showErrors(errs);
    if (errs.length) { buildForSaveError = "校验未通过"; toast("存在问题，未保存", "err"); return null; }
    var st = snapshotNow();
    var r = buildModifiedHtml(cleanSource(), st.games, st.title, st.sub, st.dedication, currentSec());
    if (!r.ok) { buildForSaveError = r.error; toast("生成失败：" + r.error, "err"); return null; }
    var bad = verifyOutput(r.html, st.games, currentSec());

  /* ---------- 保存 3：用 GitHub Token 发布 ---------- */
  function b64Utf8(str) {

  function encodePath(p) {

    var msg = (body && (body.message || (body.error && body.error.message))) || "";

    if (status === 401) return "401：Token 无效或已过期，请重新生成（需 repo / Contents: Read and write）";
    if (status === 403) return "403：Token 无权限或触发了限流" + (msg ? "（" + msg + "）" : "") + "，请确认该 Token 对 " + full + " 有 Contents 写权限";

  function getFile(repo, path, token) {

  /* ---------- D) 源码编辑器：任意仓库 / 任意文件 ---------- */
  var srcState = { repo: "hall", path: "index.html", sha: null, original: "", loaded: false, exists: true, size: 0 };

  /* 行级改动摘要：先用公共前缀/后缀裁剪，再对中间块做 LCS，得到准确的新增/删除行数。
     文件很大时（中间块 > 100 万格）退化为「整块替换」的近似计数。 */
  function lineDiffStat(oldText, newText) {
    var A = String(oldText == null ? "" : oldText).split("\n");
    var B = String(newText == null ? "" : newText).split("\n");
    var p = 0;
    while (p < A.length && p < B.length && A[p] === B[p]) p++;
    var s = 0;
    while (s < A.length - p && s < B.length - p && A[A.length - 1 - s] === B[B.length - 1 - s]) s++;
    var midA = A.slice(p, A.length - s);
    var midB = B.slice(p, B.length - s);
    var lcs = 0, exact = true;
    if (midA.length && midB.length) {
      if (midA.length * midB.length <= 1000000) lcs = lcsLength(midA, midB);
      else { lcs = 0; exact = false; }
    }
    return {
      added: midB.length - lcs,
      removed: midA.length - lcs,
      oldLines: A.length,
      newLines: B.length,
      exact: exact,

  function lcsLength(a, b) {

  /* ---------- E) 数据面板：读取同源 localStorage ---------- */
  function readKey(k) {

  /* 每个游戏的真实存储格式见各仓库源码：

  /* =====================================================================
     需求 1：管理员密码门
     三种入口触发后先出这一屏，口令对上了才构建管理面板。
     口令只以「盐 + 哈希」形式存在源码里（ADMIN_SALT / ADMIN_PASS_HASH），
     校验走纯 JS 的 hallPassHash()，不碰 crypto.subtle（file:// 下不可用）。
     ===================================================================== */
  function storageOk() {
    try { localStorage.getItem("__ha_probe__"); return true; } catch (e) { return false; }
  }
  function isRemembered() {
    try { return localStorage.getItem(UNLOCK_KEY) === "1"; } catch (e) { return false; }
  }
  /* 「记住本机」只写一个解锁标记，不写口令也不写哈希 */
  function setRemembered(on) {
    try {
      if (on) localStorage.setItem(UNLOCK_KEY, "1");
      else localStorage.removeItem(UNLOCK_KEY);
      return true;
    } catch (e) { return false; }
  }
  function cdLeft() { return Math.max(0, cdUntil - Date.now()); }
  function passwordOk(pw) {
    var p = String(pw == null ? "" : pw);
    if (!p) return false;
    return hallPassHash(p, ADMIN_SALT) === ADMIN_PASS_HASH;
  }
  function gateSay(text, isError) {
    if (!refs.gateMsg) return;
    refs.gateMsg.className = "ha-err" + (text ? " show" : "");
    refs.gateMsg.style.color = isError ? "#9a2130" : "#8a7376";
    refs.gateMsg.style.background = isError ? "#fbe9e7" : "#f6efec";
    refs.gateMsg.style.borderColor = isError ? "#f0c9c3" : "#ecdedb";
    refs.gateMsg.textContent = text || "";
  }
  function startCooldown() {
    cdUntil = Date.now() + COOLDOWN_MS;
    triesLeft = 0;
    tickCooldown();
  }
  /* 冷却倒计时：按钮上直接写还剩几秒，输入框锁死 */
  function tickCooldown() {
    if (!gateOpen) return;
    var left = cdLeft();
    if (left <= 0) {
      cdUntil = 0;
      triesLeft = MAX_TRIES;
      if (cdTimer) { clearTimeout(cdTimer); cdTimer = null; }
      if (refs.gatePw) refs.gatePw.disabled = false;
      if (refs.gateBtn) { refs.gateBtn.disabled = false; refs.gateBtn.textContent = "进入管理面板"; }
      gateSay("");
      return;
    }
    if (refs.gatePw) refs.gatePw.disabled = true;
    if (refs.gateBtn) {
      refs.gateBtn.disabled = true;
      refs.gateBtn.textContent = "冷却中 " + Math.ceil(left / 1000) + " 秒";
    }
    gateSay("⚠ 密码连续输错 " + MAX_TRIES + " 次，冷却中：还剩 " + Math.ceil(left / 1000) + " 秒", true);
    cdTimer = setTimeout(tickCooldown, 200);
  }
  /* 校验并提交密码门。返回是否通过（自动化测试也走这一条真实路径） */
  function submitGate() {
    if (!gateOpen || !refs.gatePw) return false;
    if (cdLeft() > 0) { tickCooldown(); return false; }
    var pw = refs.gatePw.value;
    if (!pw) { gateSay("请输入管理员密码", true); return false; }
    if (!passwordOk(pw)) {
      triesLeft--;
      refs.gatePw.value = "";                       /* 输错就清空 */
      if (triesLeft <= 0) startCooldown();
      else gateSay("密码不对，还可以再试 " + triesLeft + " 次", true);
      return false;
    }
    triesLeft = MAX_TRIES;
    if (refs.gateRemember && refs.gateRemember.checked) setRemembered(true);
    openPanel();
    return true;
  }
  function pwField(labelText, id, placeholder) {
    var w = el("div");
    w.appendChild(el("label", "ha-lab", labelText));
    var i = el("input");
    i.type = "password";
    i.id = id;
    i.autocomplete = "new-password";
    if (placeholder) i.placeholder = placeholder;
    w.appendChild(i);
    w._input = i;
    return w;
  }
  function buildGate(msg) {
    var root = ensureOverlay();
    var card = el("div", "ha-panel ha-gate");

    row.appendChild(remLab);

    /* file:// 或不透明源下浏览器会禁掉 localStorage：勾选框直接禁用并说明 */
    var noStore = false;

      "（README「管理员密码」一节给了算法，以及在浏览器控制台里一行算出来的办法）。");

    stat.style.marginTop = "4px";
    card.appendChild(stat);

    root.appendChild(card);

    refs.gatePw.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.keyCode === 13) { e.preventDefault(); submitGate(); }
    });
    refs.gateBtn.addEventListener("click", submitGate);
    cancel.addEventListener("click", function () { close(); });

    if (msg) gateSay(msg, false);
    if (cdLeft() > 0) tickCooldown();
    else {
      setTimeout(function () {
        if (gateOpen && refs.gatePw && !refs.gatePw.disabled) { try { refs.gatePw.focus(); } catch (e) {} }
      }, 30);

    return card;
  }

  /* 新的随机盐：优先用 crypto.getRandomValues（不需要安全上下文），失败退到 Math.random */
  function newSalt() {
    var hex = "0123456789abcdef", s = "", i;
    try {
      var a = new Uint8Array(6);
      crypto.getRandomValues(a);
      for (i = 0; i < a.length; i++) s += hex.charAt(a[i] & 15) + hex.charAt((a[i] >> 4) & 15);
      if (s.length === 12) return s;
    } catch (e) { /* 没有 crypto 就用下面的兜底 */ }
    s = "";
    for (i = 0; i < 12; i++) s += hex.charAt(Math.floor(Math.random() * 16));
    return s;
  }

    if (p !== String(pw2 == null ? "" : pw2)) return { ok: false, error: "两次输入的密码不一样" };
    var salt = rotateSalt ? newSalt() : ADMIN_SALT;

  }
  /* 真正改密码：改内存常量 → 生成产物（含产物自检）→ 有 Token 就发布，没有就复制整页 */
  function applyPassword(pw, pw2, rotateSalt) {
    var plan = planPassword(pw, pw2, rotateSalt);
    if (!plan.ok) { secSay("⚠ " + plan.error, true); return plan; }
    var oldSalt = ADMIN_SALT, oldHash = ADMIN_PASS_HASH;
    plan.oldHash = oldHash;

    ADMIN_PASS_HASH = plan.hash;

    if (!html) {
      /* 自检没过就回滚，别让页面停在一个谁也进不去的密码上 */
      ADMIN_SALT = oldSalt;
      ADMIN_PASS_HASH = oldHash;
      plan.ok = false;
      plan.error = "产物自检未通过，已回滚：" + buildForSaveError;
      secSay("⚠ " + plan.error, true);
      return plan;
    }
    plan.html = html;
    plan.bytes = html.length;
    var token = refs.token ? refs.token.value.trim() : "";
    if (token) {
      refs.publishBtn.disabled = true;
      secSay("密码已改，正在发布新文件…", false);
      publish(token, html, "更新管理员密码（管理员面板 " + nowText() + "）").then(function (r) {
        refs.publishBtn.disabled = false;
        paintPublish(r, "✅ 密码已更新并发布成功。Pages 约 1 分钟内生效，之后用新密码进面板。", false);
        secSay("✅ 密码已更新，并已发布到 GitHub（" + (r.commit || "提交成功") + "）", false);
        refreshSecNow();

        refs.publishBtn.disabled = false;
        var m = e && e.message ? e.message : String(e);
        paintPublish(null, "❌ 密码已改但发布失败：" + m, true);
        secSay("⚠ 新密码已在本页生效，但发布失败：" + m + "。可以点「② 下载 index.html」手动替换仓库文件。", true);
        refreshSecNow();
      });
    } else {
      copyText(html).then(function () {
        secSay("✅ 密码已更新（本页立即生效）。没填 GitHub Token，已把改好的整页复制到剪贴板；" +
          "也可以点「② 下载 index.html」手动替换仓库里的文件。", false);
      }).catch(function () {
        secSay("✅ 密码已更新（本页立即生效）。没填 GitHub Token，也复制失败，请点「② 下载 index.html」手动替换。", false);

          /var\s+HALL_DEDICATION\s*=\s*[\s\S]*?;/.test(src)]

    },
    /* 产物不做任何修补地自检一遍（下载/发布前的闸门） */
    verify: function () {

    },
    validate: function () { return validateGames(collectGames()); },
    /* 产物守卫的直连入口（只给自动化测试用）：传入任意源码，看它会不会被拒绝 */
    buildModified: function (src, games, title, sub, dedication, sec) {
      try { return buildModifiedHtml(src, games || collectGames(), title, sub, dedication, sec); }

    },

    buildString: function () { return buildForSave(); },

    buildWith: function (games, title, sub, dedication, sec) {

      var html = buildForSave();

        .catch(function (e) { return { ok: false, error: e && e.message ? e.message : String(e), status: e && e.status }; });
    },

    },

    /* 源码编辑器（供自动化测试驱动） */
    src: {

      presets: function () { return clone(FILE_PRESETS); },
      state: function () {
        return { repo: srcState.repo, path: srcState.path, sha: srcState.sha, loaded: srcState.loaded,

      },

      },
      load: function (repo, path) {

      },

        renderSrcDiff();

      },
      diff: function () { return srcDiff(); },
      diffText: function () { return diffText(srcDiff()); },
      commit: function () { return commitSource(); },
      copy: function () { return copySource(); },
      revert: function () { return revertSource(); },
      statusText: function () { return refs.srcInfo ? refs.srcInfo.textContent : ""; },
      msgText: function () { return refs.srcMsg ? refs.srcMsg.textContent : ""; },
      fileOptions: function () {
        var out = [], os = refs.srcFile ? refs.srcFile.options : [];
        for (var i = 0; i < os.length; i++) out.push(os[i].value);
